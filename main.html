<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IESCO Subsidy Link Generator</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f6f9;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:400px;
      background:#fff;
      padding:25px;
      border-radius:14px;
      box-shadow:0 4px 18px rgba(0,0,0,0.1);
    }

    h1{
      font-size:24px;
      text-align:center;
      margin-bottom:10px;
      color:#222;
    }

    p{
      text-align:center;
      color:#666;
      font-size:14px;
      margin-bottom:20px;
      line-height:1.5;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
      outline:none;
      margin-bottom:15px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#0d6efd;
      color:#fff;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#0b5ed7;
    }

    .result{
      margin-top:20px;
      word-break:break-word;
      font-size:14px;
      display:none;
    }

    .result a{
      color:#0d6efd;
      text-decoration:none;
    }

    .note{
      margin-top:18px;
      font-size:12px;
      color:#777;
      text-align:center;
      line-height:1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>IESCO Subsidy Link Generator</h1>

    <p>
      Enter your IESCO reference number to generate your PITC subsidy eligibility link.
    </p>

    <input
      type="text"
      id="refno"
      placeholder="Enter Reference Number"
      maxlength="20"
      inputmode="numeric"
    />

    <button onclick="generateLink()">
      Generate & Open Link
    </button>

    <div class="result" id="result"></div>

    <div class="note">
      No data is collected, stored, or shared. Everything runs only in your browser.
    </div>

  </div>

  <script>

    const input = document.getElementById("refno");

    // Allow numbers only while typing
    input.addEventListener("input", function () {

      // Remove everything except numbers
      this.value = this.value.replace(/\D/g, "");

    });

    function generateLink() {

      let refno = input.value;

      // Extra cleaning before generating link
      refno = refno.replace(/\D/g, "");

      if(refno.length < 5) {
        alert("Please enter a valid reference number.");
        return;
      }

      const finalLink =
        "https://css.pitc.com.pk/check-eligibility?refno=" + refno;

      const resultDiv = document.getElementById("result");

      resultDiv.style.display = "block";

      resultDiv.innerHTML =
        "<strong>Generated Link:</strong><br><br>" +
        "<a href='" + finalLink + "' target='_blank'>" +
        finalLink +
        "</a>";

      // Auto Redirect
      setTimeout(() => {
        window.location.href = finalLink;
      }, 1000);

    }

  </script>

</body>
</html>
